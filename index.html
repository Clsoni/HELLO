<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swastik Gold - Live Rates</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <div class="header">卐 SWASTIK GOLD</div>
    <div class="nav">
        <a href="index.html" class="active"><span class="icon material-icons">show_chart</span>Live Rates</a>
        <a href="bank.html"><span class="icon material-icons">account_balance</span>Bank</a>
        <a href="messages.html"><span class="icon material-icons">message</span>Messages</a>
        <a href="about.html"><span class="icon material-icons">info</span>About</a>
        <a href="admin.html"><span class="icon material-icons">admin_panel_settings</span>Admin</a>
    </div>

    <div class="marquee-container">
        <marquee>Welcome to Swastik Gold. Market is open.</marquee>
    </div>

    <div class="spot-prices" id="spotPrices">
        <div class="spot-item">
            <div class="spot-title">SILVER</div>
            <div class="price-box" id="spot-silver">80250</div>
        </div>
        <div class="spot-item">
            <div class="spot-title">GOLD</div>
            <div class="price-box" id="spot-gold">71350</div>
        </div>
        <div class="spot-item">
            <div class="spot-title">USDINR</div>
            <div class="price-box" id="spot-usd">83.45</div>
        </div>
    </div>

    <table class="data-table">
        <thead>
            <tr><th style="width: 50%;">PRODUCTS</th><th style="width: 25%;">BUY</th><th style="width: 25%;">SELL</th></tr>
        </thead>
        <tbody id="products-table"></tbody>
    </table>

    <table class="data-table">
        <thead>
            <tr><th style="width: 50%;">PRODUCTS</th><th style="width: 25%;">BID</th><th style="width: 25%;">ASK</th></tr>
        </thead>
        <tbody id="quotes-table"></tbody>
    </table>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
